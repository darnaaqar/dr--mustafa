name: dental_clinic_app
description: "Premium Futuristic Dental Clinic App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0         # Supabase Client SDK (updated for app_links compatibility)
  google_fonts: ^6.2.0             # For Cairo and Inter typography
  url_launcher: ^6.3.0             # For phone/whatsapp dialing
  flutter_animate: ^4.5.0          # For smooth holographic animations
  intl: ^0.19.0                    # Date formatting
  # Override app_links to compatible version
  app_links: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
