name: dr_mustafa_dental_clinic
description: "Premium Futuristic Dental Clinic App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0         # Supabase Client SDK
  google_fonts: ^6.1.0             # For Cairo and Inter typography
  url_launcher: ^6.2.5             # For phone/whatsapp dialing
  flutter_animate: ^4.5.0          # For smooth holographic animations
  intl: ^0.19.0                    # Date formatting
  shared_preferences: ^2.2.2       # For device ID storage
  cached_network_image: ^3.3.0     # Image caching
  shimmer: ^3.0.0                  # Loading shimmer effects
  flutter_native_splash: ^2.4.0    # Splash screen
  provider: ^6.1.1                 # State management for theme
  google_maps_flutter: ^2.5.3      # Google Maps location
  share_plus: ^7.2.2               # Share app feature
  before_after: ^2.0.0             # Before/After slider
  flutter_local_notifications: ^17.0.0  # Local notifications
  in_app_review: ^2.0.8            # Rate prompt

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
